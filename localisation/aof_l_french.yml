 aof_current_planet_greeting: "Greetings $aof_fed_pres$ and welcome to §Y[From.GetName]§!.\n\nI represent the administration here on §Y[event_target:current_planet.GetName]§! and will be assisting you during your stay on our world. If you'd like briefings, meetings, or to move any matters forward while you're here, just let me know. I'll see it arranged.\n\nWe hope you will enjoy the many pleasures of our home, $MY_FED_PRES$."

# Name calls
 MY_FEDERATION: "§Y[Root.Federation.GetName]§!"
 MY_FED_PRES: "§r[Root.Federation.Federation_Leader.GetRulerName]§!"
 MY_FED_PRES_COUNTRY: "§r[Root.Federation.Federation_Leader.GetName]§!"
 aof_fed_pres: "§rPresident§!"
 aof_fed_presy: "§rPresidency§!"
 aof_fed_presl: "§rPresidential§!"
 aof_market_volume_NAME: "Market Volume"

# Laws
 succession_type_election: "Elections"
 succession_type_election_desc: "As the $aof_fed_presy$ gains more power, its office must be chosen by a governing body to ensure its legitimacy."
 assembly_high: "High Council"
 assembly_high_desc: "A High Assembly of our most vital leaders will dictate the affairs of the federation.\n\n§RWARNING§!:Removing the Grand Assembly might impact a lot of other laws."
 assembly_grand: "Grand Assembly"
 assembly_grand_desc: "A Grand Assembly of democratically elected representatives from all federal worlds comes together to shape the federation's future. Here, every planet matters."
 assembly_militarist: "Permanent War Room"
 assembly_materialist: "Board of Directors"
 assembly_spiritual: "Conclave of the Faithful"
 assembly_pacifist: "Circle of Peace and love were we really like to agree with one another"
 aof_market_joined_desc: "To further federal cooperation, its §Y$aof_market_volume_NAME$§! can be directly converted into resources. The Federation's §Y$aof_market_volume_NAME$§! is shown at $f93_federation_one_station$."
 aof_market_basic: "Basic Policy"
 aof_market_basic_desc: "$aof_market_joined_desc$\n\nY$aof_market_volume_NAME$§! produce Energy, Minerals and Unity " # §Y$aof_market_volume_NAME$§! ÷ Member Count x 5% ÷ 3 = Energy Amount, Mineral Amount, Unity Amount"
 aof_market_strategic: "Strategic Policy"
 aof_market_strategic_desc: "$aof_market_joined_desc$\n\n§Y$aof_market_volume_NAME$§! produce Exotic Gases Amount, Volatile Motes Amount, Rare Crystals Amount" #÷ Member Count x 5% ÷ 25 = Exotic Gases Amount, Volatile Motes Amount, Rare Crystals Amount"
 aof_market_military: "Military Policy"
 aof_market_military_desc: "$aof_market_joined_desc$\n\n§Y$aof_market_volume_NAME$§! produce Alloy" #÷ Member Count x 5% = Alloy Amount"
 aof_market_unity: "Unity Policy"
 aof_market_unity_desc: "$aof_market_joined_desc$\n\n§Y$aof_market_volume_NAME$§! produce Alloy and Unity" #÷ Member Count x 5% ÷ 1,75 = Alloy Amount, Unity Amount"
 diplomatic_bloc_default: "Diverse Voices"
 diplomatic_bloc_default_desc: "Members align a portion of their diplomatic weight to the $aof_fed_pres$, ensuring the federation speaks with a clear voice in foreign galactic affairs."
 diplomatic_bloc_common_voice: "Common Voice"
 diplomatic_bloc_common_voice_desc: "Members align a share of their diplomatic weight to the $aof_fed_pres$, ensuring the federation speaks with a common voice in foreign galactic affairs."
 diplomatic_bloc_clear_voice: "Clear Voice"
 diplomatic_bloc_clear_voice_desc: "Members align a chunk of their diplomatic weight to the $aof_fed_pres$, ensuring the federation speaks with a clearvoice in foreign galactic affairs."
 diplomatic_bloc_united: "$resolution_custodian_united_front$"
 diplomatic_bloc_united_desc: "Members align a majority of their diplomatic weight to the $aof_fed_pres$, ensuring the federation presents as a united front in foreign galactic affairs."
 law_aof_unification: "£aof_adv_federation_cat£ Federal Unification"
 law_aof_unification_desc: "Lasting unity among the stars cannot be forged through warfare alone."
 aof_accords_none: "None"
 aof_accords_none_desc: "The federation has not negotiated any further accords between members."
 aof_accords_coop: "Cooperation Accord"
 aof_accords_coop_desc: "An accord to uplift one another and share sciences."
 aof_accords_unyielding: "Unyielding Accord"
 aof_accords_unyielding_desc: "An accord to never yield to tyranny and protect our bond."
 f93_aof_accord_coop: "$aof_accords_coop$"
 f93_aof_accord_coop_desc: "$aof_accords_coop_desc$"
 f93_aof_accord_unyielding: "$aof_accords_unyielding$"
 f93_aof_accord_unyielding_desc: "$aof_accords_unyielding_desc$"
 aof_market_none: "$fleet_contribution_none$"
 aof_market_none_desc: "Without a formal federal market we cannot enact laws to exploit it."
 aof_planet_none: "No Planet States"
 aof_planet_none_desc: "No rules or regulation is passed, nothing ever happens!"
 aof_planet_republics: "Planet Deligates"
 aof_planet_republics_desc: "Each planet in the federation has representation based on the number of £pop£ §Y$concept_pops$§!"
 aof_planet_states: "Federated Planets"
 aof_planet_states_desc: "Each planet in the federation has representation based on the £diplo_weight£ §Y$diplomatic_weight$§!"
 aof_centralized_federation: "Central Framework"
 aof_centralized_federation_desc: "The Federation remains an Alliance between sovereign members."
 aof_unified_federation: "Unified Framework"
 aof_unified_federation_desc: "The Federation will establish a new Framework to unify all members into a coherent Unionstate."
 law_category_federal_framework: "Federal Framework"
 law_category_federal_framework_desc: "The Framework for the Federal level is what binds and strenghtens the Unionstate."
 federal_framework_low: "Basic"
 federal_framework_low_desc: "The Unionstate projects Basic authority across its Worlds."
 federal_framework_medium: "Expanded"
 federal_framework_medium_desc: "The Unionstate projects Expanded authority across its Worlds."
 federal_framework_high: "Comprehensive"
 federal_framework_high_desc: "The Unionstate projects Comprehensive authority across its Worlds"
 law_aof_political_current: "Political Current"
 law_aof_political_current_desc: "These laws define the dominant ideological debates within the Federation, shaping which competing viewpoints guide its development."
 aof_current_open_seas: "£aof_neutral£Open Seas£aof_neutral£"
 aof_current_open_seas_desc: "The federation refrains from elevating any particular ideological current, allowing federal debates to unfold without direction or pressure."
 aof_current_hold_push: "£aof_authoritarian£Hold§W-§!Push£aof_egalitarian£"
 aof_current_hold_push_desc: "Reformists seek to reshape governance and adapt institutions to changing needs, while Institutionalists defend established structures and centralized authority to preserve stability."
 aof_current_matter_mind: "£aof_materialist£Body§W-§!Soul£aof_spiritualist£"
 aof_current_matter_mind_desc: "Rationalists pursue progress through scientific and material advancements, while Revelationists place trust in higher truths and tradition to guide them."
 aof_current_wall_bridge: "£aof_xenophobe£Wall§W-§!Bridge£aof_xenophile£"
 aof_current_wall_bridge_desc: "Protectionists seek to preserve identity and shield the federation from outside influence, while Expansionists promote exchange and integration with the wider galaxy."
 aof_current_hawks_droves: "£aof_militarist£Hawk§W-§!Dove£aof_pacifist£"
 aof_current_hawks_droves_desc: "Bellicists favor decisive force and a readiness to act in the federation's interests, while Legalists emphasize restraint and adherence to established rules to maintain order."
 aof_outlook_authoritarian: "Authoritarian"
 aof_outlook_authoritarian_desc: "We are at a crossing, and this shall be our way.\n§G$aof_ethic_shift_authoritarian$§!"
 aof_outlook_none: "No common outlook"
 aof_outlook_none_desc: " There will come a day when we want to choose a Outlook."
 aof_outlook_egalitarian: "Egalitarian"
 aof_outlook_egalitarian_desc: "We are at a crossing, and this shall be our way.\n§G$aof_ethic_shift_egalitarian$§!"
 aof_ethic_shift_authoritarian: "Ethic changes towards Authoritarian"
 aof_ethic_shift_egalitarian: "Ethic changes towards Egalitarian"
 aof_principle_mediation: "£aof_neutral£ Mediation"
 aof_principle_mediation_desc: "Mediation is a strong idea."
 aof_principle_free_exchange: "£aof_neutral£ Free Exchange"
 aof_principle_free_exchange_desc: "Free Exchange is a strong idea."
 aof_principle_iron_fortress: "£aof_neutral£ Iron Fortress"
 aof_principle_iron_fortress_desc: "Iron Fortress is a strong idea."
 aof_principle_all_paths: "£aof_neutral£ All Paths"
 aof_principle_all_paths_desc: "There is no path we must follow."
 aof_principle_stewardship: "£aof_neutral£ Stewardship"
 aof_principle_stewardship_desc: "One must shepard them."
 aof_principle_tradition: "£aof_neutral£ Tradition"
 aof_principle_tradition_desc: "Tradition is the bond of our people."
 aof_doctrines_mutualism: "£aof_egalitarian£ Mutualism"
 aof_doctrines_mutualism_desc: "We cherish and uphold the ideas of $aof_doctrines_mutualism$"
 aof_doctrines_institutionalism: "£aof_pacifist£ Institutionalism"
 aof_doctrines_institutionalism_desc: "We cherish and uphold the ideas of $aof_doctrines_institutionalism$"
 aof_doctrines_corporatism: "£aof_materialist£ Corporatism"
 aof_doctrines_corporatism_desc: "We cherish and uphold the ideas of $aof_doctrines_corporatism$"
 aof_doctrines_universalism: "£aof_xenophile£Universalism"
 aof_doctrines_universalism_desc: "We cherish and uphold the ideas of $aof_doctrines_universalism$"
 aof_doctrines_interventionism: "£aof_egalitarian£ Interventionism"
 aof_doctrines_interventionism_desc: "We cherish and uphold the ideas of $aof_doctrines_interventionism$"
 aof_doctrines_exclusionism: "£aof_xenophobe£ Exclusionism"
 aof_doctrines_exclusionism_desc: "We cherish and uphold the ideas of $aof_doctrines_exclusionism$"
 aof_doctrines_illuminism: "£aof_spiritualist£ Illuminism"
 aof_doctrines_illuminism_desc: "We cherish and uphold the ideas of $aof_doctrines_illuminism$"
 aof_doctrines_rationalism: "£aof_materialist£ Rationalism"
 aof_doctrines_rationalism_desc: "We cherish and uphold the ideas of $aof_doctrines_rationalism$"
 aof_doctrines_imperialism: "£aof_authoritarian£ Imperialism"
 aof_doctrines_imperialism_desc: "We cherish and uphold the ideas of $aof_doctrines_imperialism$"
 aof_doctrines_guardianism: "£aof_xenophile£ Guardianism"
 aof_doctrines_guardianism_desc: "We cherish and uphold the ideas of $aof_doctrines_guardianism$"
 aof_doctrines_theocratism: "£aof_authoritarian£ Theocratism"
 aof_doctrines_theocratism_desc: "We cherish and uphold the ideas of $aof_doctrines_theocratism$"
 aof_doctrines_puritanism: "£aof_militarist£ Puritanism"
 aof_doctrines_puritanism_desc: "We cherish and uphold the ideas of $aof_doctrines_puritanism$"
 vote_weight_planet: "World States"
 vote_weight_planet_desc: "From prosperous core planets to distant frontier colonies, every world can voice its interests on the Assembly floor."
 aof_union_assembly_old: "Old Assembly"
 aof_union_assembly_old_desc: "The Unionstate still uses the reliable Grand Assembly"
 aof_union_assembly_new: "Digitized Assembly"
 aof_union_assembly_new_desc: "Vastly digitizing Assembly procedures and introducing holographic attendance quotas will surely improve legislative efficiency!"
 aof_union_assembly_future: "Subspace Assembly"
 aof_union_assembly_future_desc: "Relocating Assembly procedures into a dedicated subspace pocket dimension will surely reduce travel delays and bureaucratic inefficiencies."

# Categories
 law_category_assembly: "Electorate"
 law_category_assembly_desc: "Determines the organization of the Federal Assembly."
 law_category_aof_accords: "Federation Accords"
 law_category_aof_accords_desc: "We have signed an accord to uphold common standards."
 law_category_aof_market: "Federal Market"
 law_category_aof_market_desc: "The Federal Market counts all produced Trade and Consumer Goods from planets within the Federation into a single number: $aof_market_volume_NAME$, which is displayed at Starlight One.\nThrough Federal laws, this volume can be converted into various resources via an Empire Modifier (it does not take away any produced Trade or Consumer Goods, it only counts them)."
 law_category_diplomatic_block: "Diplomatic Bloc"
 law_category_diplomatic_block_desc: "Our Federation can display different levels of unity towards outside groups."
 law_aof_common_outlook: "Common Outlook"
 law_aof_common_outlook_desc: "Ultimately, there is no right or wrong form of government. There are only situations and goals, but there can be a Common Outlook."
 law_aof_principle_doctrines: "Principle & Doctrines"
 law_aof_principle_doctrines_desc: "What political debates do we wanna cultivate within the Federal Assembly?"
 law_aof_union_assembly: "Unionstate Assembly"
 law_aof_union_assembly_desc: "Determines the organization of the Federal Assembly."

# Events
 f93_aof_election.1.name: "§SFederal Elections§!"
 f93_aof_election.1.desc: "The wheel of democracy has begun to turn, setting the stage for a year of federal campaigning. Assemblymen have already begun loosening their loyalties from this closing legislature in search of new coalitions, and so must we.\nBy ensuring our representatives hold their seats and even capture new ones, our nation may claim the $aof_fed_presy$ and occupy the office!"
 f93_aof_election.1.nominate: "£favor£ Nominate §G[Root.GetRulerName]§! £favor£"
 f93_aof_election.1.boost_nominate: "£tributary£  Further our campaign efforts  £tributary£"
 f93_aof_election.1.revoke_nominate: "£political_power£  Retract nomination.  £political_power£"
 f93_aof_election.1.end_nominate: "£focus_development£  Let the ballots be casted  £focus_development£"
 f93_aof_election.101.name: "The Charter"
 f93_aof_election.101.desc: "The era of rotating $aof_fed_presy$ by states is over. The members of the $MY_FEDERATION$ have signed a binding charter to ensure the §roffice's§! legitimacy via general elections. While this High Assembly of leaders has yet to define the specific mechanics of the vote, the intent is clear: Authority must be earned, not inherited by turn or power. A long line of reforms now awaits to transform this gathering into a true Grand Assembly of representation."
 f93_aof_election.101.a: "One signature after another!"
 f93_aof_election.301.name: "Administrative Focus"
 f93_aof_election.3.name: "Election Results"
 f93_aof_election.3.desc: "The final ballots have been counted and the results are clear. The $MY_FED_PRES_COUNTRY$ has secured the majority, with $MY_FED_PRES$ set to occupy the $aof_fed_presy$ of the $MY_FEDERATION$."
 f93_aof_election.3.b.desc: "The final ballots have been counted and the results are clear. The $MY_FED_PRES_COUNTRY$ has secured the majority, with $MY_FED_PRES$ set to occupy the $aof_fed_presy$ of the $MY_FEDERATION$.\n\nOfficials at $f93_federation_one_station$ have begun preparing the transition phase for the new legislature."
 f93_aof_election.3.a: "The Assembly is seated"
 f93_aof_election.301.desc: "Now that the first months of this legislature have concluded, awaits your coalition directions for this legislature's course.\nThe citizens are eager to see if your plan aligns with the promises that brought you to power."
 f93_aof_election.301.a: "£trade_protection£  $f93_pres_mod_mil$  £trade_protection£"
 f93_aof_election.301.b: "£research£  $f93_pres_mod_sci$  £research£"
 f93_aof_election.301.c: "£economy£  $f93_pres_mod_job$  £economy£"
 f93_aof_election.301.d: "£system£  $f93_pres_mod_adm$  £system£"
 f93_aof_election.302.name: "Grand Assembly"
 f93_aof_election.302.desc: "The transition of power is complete. The $MY_FEDERATION$ has officially inaugurated the Grand Assembly, effectively dissolving the High Assembly and making way for democratic representation.\n\nIt's a bridge between worlds."
 f93_aof_election.302.a: "A strong foundation for our shared future!"
 f93_aof_election.4.name: "Vote of no confidence"
 f93_aof_election.4.desc: "Formal proceedings have begun to end the $MY_FED_PRES$§r's§! term and with it the current legislature. The motion of impeachment is now on the floor as the future of the $aof_fed_presy$ remains uncertain."
 f93_aof_election.4.a: "Vote to have the legislature continue."
 f93_aof_election.4.b: "Vote to have the legislature end prematurely."
 f93_aof_election.6.name: "Breaking News: Nothing Changed"
 f93_aof_election.6.desc: "The Vote of No Confidence has failed, confirming the continued support for the $aof_fed_pres$§r's§! mandate. $MY_FED_PRES$ will remain in office."
 f93_aof_election.6.a: "and glad we are"
 f93_aof_election.6.b: "Save the slogans for next time..."
 f93_aof_election.7.name: "Breaking News: Elections Soon"
 f93_aof_election.7.desc: "The Vote of No Confidence has passed, signaling an end to the current $aof_fed_pres$§r's§! mandate. $MY_FED_PRES$ will step down and make way for new leadership."
 f93_aof_election.7.a: "Maybe not everyone deserves a vote."
 f93_aof_election.7.b: "good riddance"
 f93_aof_election.8.name: "Federal Summit"
 f93_aof_election.8.desc: "The docking bays of $f93_federation_one_station$ are crowded with gilded shuttles of the federation's elite. They are arriving from all sectors to gather at the summit, bringing with them a mix of private grievances, trade demands, and old rivalries.\n\nWhat have you brought?"
 f93_aof_election.8.a: "§rFederal Construction Contracts!§!"
 f93_aof_election.8.a_desc: "$aof_fed_presl$ Action: We will gain §G1§! Permit to build a $building_aof_federal_holdings$."
 f93_aof_election.8.b: "§rHand a Contract to someone else§!"
 f93_aof_election.8.b_desc: "$aof_fed_presl$ Action: A random valid member of the Federation will gain §G1§! Permit to build a $building_aof_federal_holdings$."
 f93_aof_election.8.c: "someone else can do it (human)"
 f93_aof_election.8.c_desc: "A random valid member of the Federation will gain §G1§! Permit to build a $building_aof_federal_holdings$."
 f93_aof_election.8.d: "someone else can do it (NPC)"
 f93_aof_election.8.d_desc: "A random valid member of the Federation will gain §G1§! Permit to build a $building_aof_federal_holdings$."
 f93_aof_election.8.e: "A new reform"
 f93_aof_election.8.f: "Some blackmail"
 f93_aof_election.8.f_desc: "We gain §G10§! Favors with a random member"
 f93_aof_election.8.g: "Good News, Everyone!"
 f93_aof_election.8.g_desc: "We gain §G2§! Favors with a random member"
 f93_aof_election.9.name: "Federal Enclave!"
 f93_aof_election.9.desc: "It looks like we have been the great winners of the Federal Summit. Not only have we gotten what we came for, but also received §G1§! Permit to construct a §Y$building_aof_federal_holdings$§! on one of our capital planets!"
 f93_aof_election.9.a: "What a weekend"
 f93_aof_galcom.0.name: "Shield and Spear"
 f93_aof_galcom.0.desc: "The Galactic Senate has consolidated emergency powers upon a Galactic Custodian to act as its spearhead. Yet, the Federal Council remains wary, unsure if this blade will be used as intended and then laid down or turned against any who dare to stand in its way."
 f93_aof_galcom.0.a: "The Federation's shield will stand ready! "
 f93_aof_galcom.0.b: "Don't you worry about it"
 f93_aof_galcom.1.name: "Throne of Tyranny"
 f93_aof_galcom.1.desc: "The Galactic Community has lost its way, and we can already see the Throne of Tyranny being bolted to the floor. The $MY_FEDERATION$ must refuse to kneel to it and leave this foul place now."
 f93_aof_galcom.1.a: "You will kneel too!"
 f93_aof_galcom.1.b: "Before it's too late..."
 f93_aof_galcom.1.c: "Not my Problem."
 f93_aof_galcom.1.d: "This Alliance was weak anyways."
 f93_aof_background.10.name: "High Assembly"
 f93_aof_background.10.desc: "The last vote has been cast and the last bill signed, tomorrow will the Grand Assembly be dissolved and reduced to a High Assembly. Uncertainty and anger has spread through the news."
 f93_aof_background.10.a: "A step back."
 f93_aof_background.11.name: "Party Formation"
 f93_aof_background.11.desc: "The $MY_FEDERATION$ has gradually repositioned itself within the Galactic Senate, with member representatives increasingly likely to vote in unison on key resolutions.\nWhile these voting patterns are far from a formal party and internal deviancy remains a factor, the emergence of this “Bloc” behavior has not gone unnoticed."
 f93_aof_background.11.a: "Galactic affairs are Federal affairs too."
 f93_aof_background.11.b: "We need to outpace them!"
 f93_aof_background.11.c: "This makes us less important..."
 f93_aof_background.12.name: "A United Front"
 f93_aof_background.12.desc: "The $MY_FEDERATION$ has finalized its transition into a disciplined voting bloc. This shift is a direct response to the foreign overlords and hostile alliances that seek to undermine us. By standing as a United Front, we ensure that the needs of our citizens are heard loudly and clearly, standing firm against those who do not share our values.\n\nWhat once began as a mere agreement of coordination has shaped to become a diplomatic powerhouse."
 f93_aof_background.12.a: "Long live the Federation!"
 f93_aof_background.13.name: "$f93_federation_one_station$ Evacuates"
 f93_aof_background.13.desc: "The war has reached our doorstep, and the order to initiate an emergency departure for $f93_federation_one_station$ from [f93_had_federation_one.GetName]'s orbit has been given.\nEvacuations are underway, and non- essential personnel are being hurried to the docking bays as the station's thrusters are already pushing it out of orbit. For the remainder of the conflict, the Assembly chambers must stay vacant and meetings be hosted digitally, slowing or even halting many government operations.\nThe Station is now over §Y[f93_has_federation_one.GetName]§! in the §Y[f93_has_federation_one.System.GetName]§!."
 f93_aof_background.13.a: "Get them out of here!"
 aof_flag_selection.0.name: "Unionstate"
 aof_flag_selection.0.desc: "The Commission for Federal Aesthetics has finished its work and placed three final proposals for a common Unionstate emblem on your desk.\nEach design seeks to unify our varying cultures under a single banner. We can now adopt one of these new symbols to lead our state, or set them aside to honor the heritage. "
 aof_flag_selection.0.a: "§RRed§! design"
 aof_flag_selection.0.b: "§YYellow§! design"
 aof_flag_selection.0.c: "§BBlue§! design"
 aof_flag_selection.0.d: "We keep the emblem of our Heritage"
 aof_planet_dip.31.name: "Security Funding"
 aof_planet_dip.31.desc: "The orbital station to safeguard the orbit of §Y[Orbit.GetName]§! will soon loose its Federal funding, shall we renew the contract or let it run out?"
 aof_planet_dip.31.a: "Renew the funding"
 aof_planet_dip.31.b: "End operations there"
 aof_planet_dip.31.c: "Secure funding for the future."
 f93_aof_background.21.name:0 "A Unified Federation"
 f93_aof_background.21.desc:0 "It is dawn again, and the nations that made up the §Y[From.Federation.GetName]§! have seized their place on the Galactic Stage. In their name awakes a new nation - a Unionstate.\n\nThe birth of this Galactic Powerhouse already sends shockwaves across the Galaxy, as this transformation hails in a new era of Superstates."
 f93_aof_background.21.a:0 "This demands respect!"
 f93_aof_background.21.b:0 "This demands respect..."
 f93_aof_background.23.name:0 "World States"
 f93_aof_background.23.desc:0 "The $MY_FEDERATION$ has enacted sweeping representation reforms, granting all member worlds the right to send representatives to the Grand Assembly. From prosperous core planets to distant frontier colonies, every world may now voice its interests on the Assembly floor.\n$f93_aof_background.23.extra$"
 f93_aof_background.23.extra: "§RYou can contact the World States and Interact with them. You find them in the federation Menu. Click their Flags to interact.§!"
 f93_aof_background.23.a:0 "Spearheading democracy, guys!"
 f93_aof_background.24.name:0 "Common Outlook"
 f93_aof_background.24.desc:0 "Ultimately, there is no right or wrong form of government. There are only situations and goals, but there can be a Common Outlook.\n\nThe $MY_FEDERATION$ has chosen to strive towards Authoritarian ideals, shifting all of us closer together."
 f93_aof_background.24.a:0 "This is our Outlook."
 f93_aof_background.24.desc_2:0 "Ultimately, there is no right or wrong form of government. There are only situations and goals, but there can be a Common Outlook.\n\nThe $MY_FEDERATION$ has chosen to strive towards Egalitarian ideals, shifting all of us closer together."

# Buildings
 building_aof_federal_holdings: "Federal Enclave"

 aof_current_planet_local_governance: "If you wish, $aof_fed_pres$, we can review how our administration aligns with the federal standards.\n\nI will have our current policies prepared for you, of course. Though I should note that most matters are usually handled locally... \n\nYou must know, things don't always work quite as neatly as they do on paper."
 aof_current_planet_local_enforce: "Enforce stricter federal alignments."
 aof_current_planet_local_encurage: "Encourage further federal alignments."
 aof_current_planet_local_enable: "Enable further local autonomy."
 aof_current_planet_local_BACK: "$BACK$"
 aof_current_planet_security_matters_option: "Discuss security matters"
 aof_current_planet_security_matters: "$aof_fed_pres$, I want to provide you with an overview of our security situation.\n\nWe've recently observed an uptick in piracy and criminal activity within the system. Still manageable, but increasingly noticeable. Our Police Force would welcome joint operations with Federal Security Forces in orbit.\n\Though, if I may add, a small display of order is all that's needed. We would prefer to avoid anything resembling a blockade above our world."
 aof_current_planet_security_police: "Offer to supplement orbital policing."
 aof_current_planet_security_fleets: "Subsidize Shipyards"
 aof_current_planet_security_homeguard: "Mobilize the Homeguard"
 aof_current_planet_security_homeguard_cooldown: "The reserves are on active duty until §Y[This.aof_homeguard_mobilized]§!."
 aof_current_planet_security_back: "No interventions needed"
 aof_current_planet_federal_services_option: "Expand Federal Services"
 aof_current_planet_federal_services: "$aof_fed_pres$, shall we look into expanding federal services here on §Y[event_target:current_planet.GetName]§!?\n\nThere are a number of local projects that would benefit from additional federal funding - improving both infrastructure and the daily life of our citizens. With your backing, we could move several of these forward right away.\n\nJust tell me where you'd like to begin.\n\n§RWARNING§!: These policies cannot be undone!"
 aof_current_planet_federal_services_mailing: "Fund Hyperspace Mailing"
 aof_current_planet_federal_services_broadcast: "Fund Broadcasting Network"
 aof_current_planet_federal_services_atmos: "Fund Atmospheric Tuning Agency"
 aof_current_planet_federal_services_transit: "Fund Civillian Transit Lines"
 aof_current_planet_federal_services_health: "Fund Biogenesis Health Initiative"
 aof_current_planet_federal_services_education: "Fund Public Education System"
 aof_current_planet_federal_services_back: "All done for today."
 aof_current_planet_close: "Goodbye."
